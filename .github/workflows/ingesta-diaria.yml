name: Ingesta diaria

# Postgres/Supabase (migrado desde Turso ago 2026, ver
# docs/12-migracion-supabase.md): no tiene pg_cron habilitado para este
# proyecto ni Edge Functions propias aquí, así que el trabajo programado sigue
# viviendo en GitHub Actions, no en la base.
#
# Se eligió GitHub Actions en vez de Vercel Cron porque este job descarga los
# ficheros de la temporada, parsea miles de partidos y reentrena el Elo: no cabe
# en el límite de tiempo de una función serverless del plan Hobby.
#
# Secrets necesarios en el repositorio:
#   SUPABASE_DB_HOST, SUPABASE_DB_PORT, SUPABASE_DB_NAME,
#   SUPABASE_DB_USER, SUPABASE_DB_PASSWORD (sin RLS: acceso total)

on:
  schedule:
    # 06:30 UTC. La fuente publica el fichero de la temporada una vez al día.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      reset_elo:
        description: 'Reentrenar el Elo desde cero (necesario si la fuente corrigió resultados)'
        type: boolean
        default: false

concurrency:
  # Dos ingestas simultáneas escribirían el Elo a la vez: se serializan.
  group: ingesta-supabase
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    # 30 min bastaba con ~45.000 partidos. Con los ~33.500 de Challenger
    # promovidos a `matches` (promote-challenger.ts) el run #27 se quedó a
    # mitad del entrenamiento del Elo y lo mató el timeout, dejando
    # player_ratings vacía. Un --reset es un caso extremo (recorre TODO el
    # histórico); el día a día sin --reset sigue siendo incremental y rápido.
    timeout-minutes: 90
    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Los usa scripts/paper-trade.ts para el push de "oportunidades de
      # cuotas" tras colocar picks nuevos en modo Favorito (src/lib/push.ts).
      PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Comprobar que hay base configurada
        run: |
          if [ -z "$SUPABASE_DB_HOST" ]; then
            echo "Falta el secret SUPABASE_DB_HOST." >&2
            exit 1
          fi

      - name: Migraciones
        run: npm run db:migrate

      - name: Ingesta de la temporada en curso
        # Solo el año actual: las temporadas cerradas ya no cambian y bajarlas
        # todos los días sería tirar ancho de banda de la fuente.
        run: npm run db:ingest -- --from $(date -u +%Y) --force

      - name: Torneos en curso y calendario (ESPN)
        # Fuente gratuita de los torneos que se juegan AHORA (incluidos los 250
        # que The Odds API no cubre), su calendario y los marcadores en vivo.
        run: npx tsx scripts/espn-ingest.ts

      - name: Cuotas de partidos futuros (odds-api.io)
        # Fuente ACTUAL de cuotas pre-partido (reemplazó a The Odds API en
        # sept 2026 — ver docs/15). Cubre ATP/WTA/Challenger. Sin
        # ODDS_API_IO_KEY es un no-op explícito.
        #
        # continue-on-error: las cuotas son "mejor esfuerzo, una vez al día" y
        # NUNCA deben poder frenar lo de después (reconcile, elo, predict,
        # paper-trade). Así pasó en sept 2026: el 401 por cuota agotada de The
        # Odds API frenó todo el pipeline durante días.
        continue-on-error: true
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ secrets.ODDS_API_IO_BOOKMAKERS }}
        run: npx tsx scripts/odds-ingest-io.ts

      - name: Cuotas de partidos futuros (The Odds API — fallback)
        # Solo corre si NO hay ODDS_API_IO_KEY (el script se salta solo si la
        # hay). Se deja como respaldo por si odds-api.io falla.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          # Vacío = h2h,totals (2 créditos/torneo). Poner 'h2h,totals,spreads'
          # para reactivar el hándicap de juegos (+1 crédito).
          ODDS_API_MARKETS: ${{ secrets.ODDS_API_MARKETS }}
        run: npx tsx scripts/odds-ingest.ts

      - name: Reconciliar programados con jugados
        # Va DESPUÉS de las tres fuentes (tennis-data arriba, ESPN y The Odds
        # API): fusiona los torneos duplicados que cualquiera de ellas haya
        # creado hoy (mismo evento, nombre distinto — "National Bank Open
        # presented by Rogers" de ESPN contra "ATP Canadian Open" de tennis-data,
        # p.ej.) y mueve los partidos 'scheduled' ya jugados a su fila
        # definitiva, con cuotas y apuestas. Si corriera antes de ESPN, el
        # duplicado que ESPN crea en este mismo run se quedaría sin fusionar
        # hasta el día siguiente — y con él, sus marcadores en vivo invisibles
        # en "Torneos en vivo".
        run: npx tsx scripts/reconcile.ts

      - name: Entrenar Elo y calcular features
        run: |
          if [ "${{ inputs.reset_elo }}" = "true" ]; then
            npm run db:elo -- --reset
          else
            npm run db:elo
          fi

      - name: Elo de los últimos 2 años (solo ficha, no alimenta el modelo)
        run: npm run db:elo:recent

      - name: Predecir los partidos nuevos
        # Aplica los pesos YA ajustados; NO reajusta el modelo. Reajustar a
        # diario lo iría cambiando solo, en silencio, y ninguna métrica
        # publicada seguiría siendo comparable con la del día anterior.
        # Reajustar es una decisión explícita: scripts/fit-model.ts.
        run: |
          if [ "${{ inputs.reset_elo }}" = "true" ]; then
            npx tsx scripts/predict.ts --all
          else
            npx tsx scripts/predict.ts
          fi

      - name: Paper Trading (simulado, modo Favorito)
        # Coloca apuestas FICTICIAS sobre partidos con cuota real y liquida las
        # ya resueltas. No ejecuta nada real ni habla con ninguna casa. Manda
        # el push de "oportunidades de cuotas" si coloca picks nuevos.
        run: npx tsx scripts/paper-trade.ts

      - name: Evaluación contra el mercado
        # No falla el job: es un informe que queda en el log para vigilar que el
        # modelo no se degrade en silencio.
        run: npx tsx scripts/evaluate.ts || true
